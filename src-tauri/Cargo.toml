[package]
name = "Flow"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled, so `~/.flow` reads the same on every machine the app is installed on
# rather than through whichever SQLite the OS happens to ship.
rusqlite = { version = "0.40", features = ["bundled"] }
loro = "1.13.9"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.33"
local-ip-address = "0.6.13"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
base64 = "0.23.1"
# A `.cmir` is a gzip-wrapped envelope — see `cmir.rs`. Pure Rust, so nothing
# about reading one depends on which zlib the machine happens to have.
flate2 = "1"

